name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # apps/mcp-proxmox等のtypecheck/lintはpackages/shared-types・packages/dbの
      # ビルド済み型宣言(dist/*.d.ts)に依存するため、必ずbuildを先に実行する
      # (実機で再現・確認済み。ローカルではdist/が残っていて気づけなかった)
      - name: Build
        run: pnpm -r run build

      - name: Typecheck
        run: pnpm -r run typecheck

      - name: Lint
        run: pnpm exec eslint .
